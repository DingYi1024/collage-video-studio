name: Validate Skill

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run offline acceptance test
        run: python scripts/selftest.py

      - name: Build Remotion visual workspace
        working-directory: workspace
        run: |
          npm ci
          npm run build

      - name: Verify Codex plugin projection
        run: python scripts/sync_plugin.py --check

      - name: Build installable package
        run: |
          mkdir -p dist
          python scripts/package_skill.py \
            --output dist/collage-video-studio.skill \
            --force

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: collage-video-studio
          path: dist/collage-video-studio.skill
          if-no-files-found: error
